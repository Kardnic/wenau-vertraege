<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Programm Wenau Verträge (Web)</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Excel Bibliothek -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- PDF-LIB -->
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

  <!-- ZIP Library (für Passwort-ZIP-Export) -->
<script src="https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.20/dist/zip.min.js"></script>


  <!-- Styles -->
  <link rel="stylesheet" href="style.css">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Mobile -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="assets/logo.png">

</head>
<body>

  <header>
    Jugendsport Wenau – Vertragsverwaltung (Web)
  </header>

 

  <div class="container">
     <!-- SAISON FILTER -->
  <div class="card" style="margin: 20px;">
    <label>Saison auswählen:</label>
    <select id="saisonFilter"></select>
  </div>
    <!-- FORMULAR -->
    <div class="card">
      <div class="accordion-header" id="formToggle">
        <h2>Spieler hinzufügen / bearbeiten</h2>
        <span class="arrow">▼</span>
      </div>

      <div id="formContainer" class="accordion-content">
        <form id="spielerForm">

          <label>Name:</label>
          <input type="text" id="name" required>

          <label>Saison:</label>
          <select id="saison"></select>

          <label>Fahrtgeld:</label>
          <input type="number" id="fahrtgeld" step="0.01">

          <label>Trainingsprämie:</label>
          <input type="number" id="trainingspraemie" step="0.01">

          <label>Spielprämie:</label>
          <input type="number" id="spielpraemie" step="0.01">

          <label>Siegprämie:</label>
          <input type="number" id="siegpraemie" step="0.01">

          <label>Gehalt / Monat:</label>
          <input type="number" id="gehalt_monat" step="0.01" readonly>

          <label>Gehalt / Jahr:</label>
          <input type="number" id="gehalt_jahr" step="0.01" readonly>

          <label>Zusatzbedingungen:</label>
          <textarea id="zusatzbedingungen" rows="4" placeholder="Optionale zusätzliche Bedingungen..."></textarea>

          <button type="submit">Speichern</button>
          <p id="status"></p>
        </form>
      </div>
    </div>  

    <!-- TABELLE -->
    <div class="card">

  <div class="accordion-header" id="listToggle">
    <h2>Spielerliste</h2>
    <span class="arrow">▼</span>
  </div>

  <div id="listContainer" class="accordion-content">
    <div class="table-wrapper">
    <table id="spielerliste">
      <thead>
      <tr>
        <th class="sortable" data-key="name">Name <span class="sort-icon"></span></th>
        <th class="sortable" data-key="fahrtgeld">Fahrtgeld <span class="sort-icon"></span></th>
        <th class="sortable" data-key="trainingspraemie">Trainingsprämie <span class="sort-icon"></span></th>
        <th class="sortable" data-key="spielpraemie">Spielprämie <span class="sort-icon"></span></th>
        <th class="sortable" data-key="siegpraemie">Siegprämie <span class="sort-icon"></span></th>
        <th class="sortable" data-key="gehalt_monat">Monat <span class="sort-icon"></span></th>
        <th class="sortable" data-key="gehalt_jahr">Jahr <span class="sort-icon"></span></th>

        <th>Bearbeiten</th>
        <th>Löschen</th>
        <th>Vertrag</th>
      </tr>
      </thead>

      <tbody id="spielerBody"></tbody>
    </table>
    </div>
    <br>

    <button id="exportBtn" class="action-btn">Excel exportieren</button>

    <label class="action-btn" style="display:inline-block; cursor:pointer;">
      Excel importieren
      <input type="file" id="importFile" accept=".xlsx" style="display:none;">
    </label>

  </div>
</div>

  </div>

  <!-- PDF Generator -->
  <script src="pdf.js"></script>

  <!-- Haupt-App -->
  <script src="app.js"></script>

  <!-- SW -->
  <script>
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      navigator.serviceWorker.register("service-worker.js")
        .then(() => console.log("SW registriert"))
        .catch(err => console.error("SW Fehler:", err));
    }
  </script>

</body>
</html>
